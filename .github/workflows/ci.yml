name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  qualite:
    name: Lint, types et tests unitaires
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  e2e:
    name: Intégration et bout en bout
    runs-on: ubuntu-latest
    needs: qualite
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: vault
          POSTGRES_PASSWORD: vault-ci
          POSTGRES_DB: vault
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vault"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://vault:vault-ci@localhost:5432/vault
      APP_URL: http://localhost:3000
      AUTH_TRUST_HOST: "true"
      LOG_LEVEL: warn
      DEMO_MODE: "true"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Secrets éphémères
        run: |
          echo "AUTH_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
          echo "ENCRYPTION_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
          echo "BLIND_INDEX_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - name: Tests d'intégration (base réelle)
        run: npm run test:integration
        env:
          TEST_DATABASE_URL: postgresql://vault:vault-ci@localhost:5432/vault
      - run: npm run db:seed
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  docker:
    name: docker compose up
    runs-on: ubuntu-latest
    needs: qualite
    steps:
      - uses: actions/checkout@v5
      - run: docker compose up --build --detach --wait --wait-timeout 300
      - run: curl --fail --silent http://127.0.0.1:3000/api/health
      - if: always()
        run: docker compose logs --no-color app setup | tail -n 200
      - if: always()
        run: docker compose down --volumes
